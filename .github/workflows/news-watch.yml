name: News Watch (Vietstock & CafeF)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and notify
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python scripts/fetch_news.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_links.json state/last_index.json
          git diff --cached --quiet || git commit -m "Update seen links state"
          git push
